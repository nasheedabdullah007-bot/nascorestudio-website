<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found – NASCORE STUDIO</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts path to query/hash parameter so index.html can route appropriately
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#050508;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <h1 style="font-size:24px;margin-bottom:8px;">Redirecting to NASCORE STUDIO...</h1>
      <p style="color:#94a3b8;font-size:14px;">If you are not redirected automatically, <a href="/" style="color:#38bdf8;">click here</a>.</p>
    </div>
  </body>
</html>
